# 鷹眼看盤 中繼服務（Cloudflare Worker）
# 由 .github/workflows/worker.yml 自動部署；選配的富果金鑰以 secret FUGLE_API_KEY 設定。
name = "hawk-chart"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# 跨裝置同步與伺服器端警示的儲存空間（KV）。id 由 Deploy Worker 流程自動建立並填入。
[[kv_namespaces]]
binding = "HAWK"
id = "__KV_ID__"

# 每分鐘檢查一次伺服器端警示
[triggers]
crons = ["* * * * *"]
